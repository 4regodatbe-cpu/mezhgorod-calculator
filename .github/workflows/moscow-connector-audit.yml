name: Moscow connector audit
on:
  push:
    branches: [fix-systemic-toll-composition]
    paths:
      - scripts/moscow-connector-audit.mjs
      - .github/workflows/moscow-connector-audit.yml
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - run: node scripts/moscow-connector-audit.mjs

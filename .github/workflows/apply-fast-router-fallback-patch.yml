name: Apply fast-router fallback patch
on:
  push:
    branches: [fix-systemic-toll-composition]
    paths:
      - scripts/apply-fast-router-fallback-patch.mjs
      - .github/workflows/apply-fast-router-fallback-patch.yml
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-systemic-toll-composition
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - run: node scripts/apply-fast-router-fallback-patch.mjs
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/api/v2/calculate/route.ts
          git diff --cached --quiet && exit 0
          git commit -m "Add BRouter fast fallback and majority route QA"
          git push origin HEAD:fix-systemic-toll-composition

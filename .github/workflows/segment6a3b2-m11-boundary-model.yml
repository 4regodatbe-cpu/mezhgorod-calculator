name: Segment 6A3B2 M11 boundary model

on:
  push:
    branches:
      - optimize-calculator-2
    paths:
      - lib/toll-engine/m11-boundaries.ts
      - scripts/segment6a3b2-m11-boundary-model-test.ts
      - data/tolls/m11/2026-04-24-15-58-category1.json
      - data/tolls/m11/2026-03-02-58-679-category1-a1-controls.json
      - data/tolls/m11/2026-02-24-15-58-facility-evidence.json
      - .github/workflows/segment6a3b2-m11-boundary-model.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run deterministic M11 boundary-model assertions
        run: node --experimental-strip-types scripts/segment6a3b2-m11-boundary-model-test.ts

      - name: Assert no production API integration
        run: |
          if grep -q "m11-boundaries" app/api/v2/calculate/route.ts; then
            echo "Segment 6A3B2 must not integrate the boundary model into production API"
            exit 1
          fi

      - name: Production build
        run: pnpm build

name: Valhalla hard toll exclusion probe

on:
  push:
    branches:
      - optimize-calculator-2
    paths:
      - "scripts/probe-valhalla-hard-tolls.mjs"
      - ".github/workflows/valhalla-hard-tolls-probe.yml"
  workflow_dispatch:

concurrency:
  group: valhalla-hard-tolls-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Probe public Valhalla
        run: node scripts/probe-valhalla-hard-tolls.mjs
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valhalla-hard-tolls-probe
          path: valhalla-hard-tolls-probe.json
          retention-days: 30
          if-no-files-found: warn

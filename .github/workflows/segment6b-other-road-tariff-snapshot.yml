name: Segment 6B remaining road tariff snapshot
on:
  push:
    branches: [optimize-calculator-2]
    paths:
      - data/tolls/2026-10-01-avtodor-other-roads-category1.json
      - scripts/segment6b-other-road-tariff-snapshot-test.ts
      - .github/workflows/segment6b-other-road-tariff-snapshot.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.25.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22.13.0', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node --experimental-strip-types scripts/segment6b-other-road-tariff-snapshot-test.ts
      - run: pnpm build

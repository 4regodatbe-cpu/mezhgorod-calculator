name: Segment 6A3A2C M11 partial current tariff core

on:
  push:
    branches:
      - optimize-calculator-2
    paths:
      - lib/toll-engine/m11-current-tariffs.ts
      - scripts/segment6a3a2c-m11-partial-tariff-core-test.ts
      - data/tolls/m11/2026-10-01-58-679-category1-a1-current.json
      - checkpoints/SEGMENT_6A3A2C_M11_PARTIAL_TARIFF_CORE_PLAN.md
      - .github/workflows/segment6a3a2c-m11-partial-tariff-core.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run deterministic M11 partial current tariff assertions
        run: node --experimental-strip-types scripts/segment6a3a2c-m11-partial-tariff-core-test.ts

      - name: Assert no production API integration
        run: |
          if grep -q "m11-current-tariffs" app/api/v2/calculate/route.ts; then
            echo "Segment 6A3A2C must not integrate partial M11 tariff data into production API"
            exit 1
          fi

      - name: Production build
        run: pnpm build

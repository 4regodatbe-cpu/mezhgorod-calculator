name: Segment 6A3B2D M11 OSM toll object inventory

on:
  push:
    branches:
      - optimize-calculator-2
    paths:
      - checkpoints/SEGMENT_6A3B2D_M11_OSM_OBJECT_INVENTORY_PLAN.md
      - scripts/segment6a3b2d-m11-osm-toll-inventory.mjs
      - scripts/segment6a3b2d-m11-osm-parent-context.mjs
      - scripts/segment6a3b2d-m11-osm-api-unresolved-context.mjs
      - .github/workflows/segment6a3b2d-m11-osm-toll-inventory.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unresolved-context:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Query direct OSM API context for unresolved M11 candidates
        run: node scripts/segment6a3b2d-m11-osm-api-unresolved-context.mjs

      - name: Assert diagnostic-only scope
        run: |
          set -euo pipefail
          test -s m11-osm-api-unresolved-context.json
          if grep -R "segment6a3b2d\|m11-osm-api-unresolved-context" app/api/v2/calculate lib/toll-engine/m11-current-tariffs.ts 2>/dev/null; then
            echo "Diagnostic OSM context must not be imported into production calculation"
            exit 1
          fi

      - name: Upload OSM unresolved context evidence
        uses: actions/upload-artifact@v4
        with:
          name: m11-osm-api-unresolved-context
          path: m11-osm-api-unresolved-context.json
          if-no-files-found: error
          retention-days: 7

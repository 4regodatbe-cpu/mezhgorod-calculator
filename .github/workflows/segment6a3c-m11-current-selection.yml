name: Segment 6A3C M11 current tariff selection
on:
  push:
    branches: [optimize-calculator-2]
    paths:
      - lib/toll-engine/m11-current-selection.ts
      - lib/toll-engine/m11-current-tariffs.ts
      - scripts/segment6a3c-m11-current-selection-test.ts
      - checkpoints/SEGMENT_6A3C_M11_TARIFF_SELECTION_PLAN.md
      - .github/workflows/segment6a3c-m11-current-selection.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.25.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22.13.0', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node --experimental-strip-types scripts/segment6a3c-m11-current-selection-test.ts
      - name: Assert no production integration
        run: |
          if grep -q "m11-current-selection" app/api/v2/calculate/route.ts; then exit 1; fi
      - run: pnpm build

name: Segment 6A3D M11 production wrapper
on:
  push:
    branches: [optimize-calculator-2]
    paths:
      - lib/toll-engine/m11-production.ts
      - scripts/segment6a3d-m11-production-wrapper-test.ts
      - checkpoints/SEGMENT_6A3D_M11_PRODUCTION_WRAPPER_PLAN.md
      - .github/workflows/segment6a3d-m11-production-wrapper.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.25.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22.13.0', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node --experimental-strip-types scripts/segment6a3d-m11-production-wrapper-test.ts
      - name: Assert wrapper not yet imported by user API
        run: |
          if grep -q "m11-production" app/api/v2/calculate/route.ts; then exit 1; fi
      - run: pnpm build

name: Temporary OSM M4 toll inventory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/osm-m4-toll-inventory.yml'

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Query only missing M4 toll plazas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inventory/parts

          # The broad M-4 inventory already recovered most official plazas.
          # Only six official PVPs remain unresolved. Small local boxes avoid
          # the repeated public-Overpass timeouts caused by region-wide scans.
          targets=(
            '133|54.45,37.70,54.90,38.30'
            '515|51.70,39.05,51.90,39.40'
            '545|51.30,39.35,51.65,39.75'
            '803|49.32,40.54,49.42,40.66'
            '911|48.42,40.28,48.56,40.40'
            '1046|47.28,39.88,47.40,40.02'
          )

          endpoints=(
            'https://maps.mail.ru/osm/tools/overpass/api/interpreter'
            'https://overpass.private.coffee/api/interpreter'
            'https://overpass-api.de/api/interpreter'
          )

          fetch_target() {
            local km="$1"
            local bbox="$2"
            local output="$3"
            local query="[out:json][timeout:25];node[\"barrier\"=\"toll_booth\"](${bbox});out body;"
            local endpoint

            for endpoint in "${endpoints[@]}"; do
              echo "PVP ${km}: bbox=${bbox}: trying ${endpoint}"
              if curl --fail --show-error --silent --max-time 35 \
                -A 'MezhgorodCalcRouteAudit/1.3 (GitHub Actions)' \
                -H 'Content-Type: application/x-www-form-urlencoded' \
                --data-urlencode "data=${query}" \
                "${endpoint}" \
                -o "${output}"; then
                if jq -e '.elements | type == "array"' "${output}" >/dev/null; then
                  echo "PVP ${km}: received $(jq '.elements | length' "${output}") toll-booth nodes"
                  return 0
                fi
              fi
              rm -f "${output}"
            done

            echo "PVP ${km}: all endpoints failed" >&2
            printf '{"version":0.6,"elements":[]}' > "${output}"
            return 1
          }

          failed=0
          for target in "${targets[@]}"; do
            IFS='|' read -r km bbox <<< "$target"
            if ! fetch_target "$km" "$bbox" "inventory/parts/pvp-${km}.json"; then
              failed=$((failed + 1))
            fi
          done

          jq -s '{
            version: 0.6,
            generator: "mezhgorod-m4-missing-pvp-inventory",
            elements: ([.[].elements[]] | unique_by(.id))
          }' inventory/parts/*.json > inventory/m4-missing-toll-booths.json

          jq '[.elements[] | {id,lat,lon,tags}]' \
            inventory/m4-missing-toll-booths.json > inventory/m4-missing-toll-booths-compact.json

          jq -n --argjson requested "${#targets[@]}" --argjson failed "$failed" \
            --argjson nodes "$(jq '.elements | length' inventory/m4-missing-toll-booths.json)" \
            '{requestedTargets:$requested, failedTargets:$failed, complete:($failed == 0), uniqueNodes:$nodes}' \
            > inventory/m4-inventory-status.json

          echo "--- candidates ---"
          jq -r '.elements[] | [.id,.lat,.lon,(.tags.name // ""),(.tags.ref // ""),(.tags.operator // ""),(.tags.highway // ""),(.tags.toll // "")] | @tsv' \
            inventory/m4-missing-toll-booths.json || true

          echo "Queried ${#targets[@]} missing PVPs; failed=${failed}; nodes=$(jq '.elements | length' inventory/m4-missing-toll-booths.json)"

          if [ "$failed" -gt 0 ]; then
            exit 1
          fi

      - name: Upload inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osm-m4-toll-inventory
          path: |
            inventory/*.json
            inventory/parts/*.json
          retention-days: 7

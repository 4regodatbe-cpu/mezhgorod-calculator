name: Temporary OSM M4 toll inventory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/osm-m4-toll-inventory.yml'

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Query OSM toll booths in M4 corridor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inventory/parts

          # Public Overpass instances repeatedly timed out on broad southern
          # Russia boxes. Query a chain of narrow, overlapping tiles following
          # the M-4 corridor instead. Each tile is small enough to be cheap and
          # partial results are always preserved for diagnostics.
          boxes=(
            '55.0,37.0,56.1,39.0'
            '54.0,37.0,55.2,39.2'
            '53.0,37.2,54.2,39.5'
            '52.0,37.5,53.2,39.8'
            '51.0,38.0,52.2,40.2'
            '50.0,38.8,51.2,41.0'
            '49.0,39.0,50.2,41.0'
            '48.0,39.0,49.2,41.0'
            '47.0,38.8,48.2,40.8'
            '46.0,38.5,47.2,40.5'
            '45.0,38.3,46.2,40.5'
            '44.2,37.5,45.2,40.2'
          )

          endpoints=(
            'https://maps.mail.ru/osm/tools/overpass/api/interpreter'
            'https://overpass.private.coffee/api/interpreter'
            'https://overpass-api.de/api/interpreter'
          )

          fetch_box() {
            local bbox="$1"
            local output="$2"
            local query="[out:json][timeout:35];node[\"barrier\"=\"toll_booth\"](${bbox});out body;"
            local endpoint

            for endpoint in "${endpoints[@]}"; do
              echo "bbox=${bbox}: trying ${endpoint}"
              if curl --fail --show-error --silent --max-time 45 \
                -A 'MezhgorodCalcRouteAudit/1.2 (GitHub Actions)' \
                -H 'Content-Type: application/x-www-form-urlencoded' \
                --data-urlencode "data=${query}" \
                "${endpoint}" \
                -o "${output}"; then
                if jq -e '.elements | type == "array"' "${output}" >/dev/null; then
                  echo "bbox=${bbox}: received $(jq '.elements | length' "${output}") nodes"
                  return 0
                fi
              fi
              rm -f "${output}"
            done

            echo "bbox=${bbox}: all endpoints failed" >&2
            printf '{"version":0.6,"elements":[]}' > "${output}"
            return 1
          }

          index=0
          failed=0
          for bbox in "${boxes[@]}"; do
            index=$((index + 1))
            if ! fetch_box "${bbox}" "inventory/parts/part-${index}.json"; then
              failed=$((failed + 1))
            fi
          done

          jq -s '{
            version: 0.6,
            generator: "mezhgorod-m4-inventory",
            elements: ([.[].elements[]] | unique_by(.id))
          }' inventory/parts/*.json > inventory/m4-toll-booths.json

          jq '[.elements[] | {id,lat,lon,tags}]' \
            inventory/m4-toll-booths.json > inventory/m4-toll-booths-compact.json

          jq -n --argjson requested "${#boxes[@]}" --argjson failed "$failed" \
            --argjson nodes "$(jq '.elements | length' inventory/m4-toll-booths.json)" \
            '{requestedTiles:$requested, failedTiles:$failed, complete:($failed == 0), uniqueNodes:$nodes}' \
            > inventory/m4-inventory-status.json

          echo "Found $(jq '.elements | length' inventory/m4-toll-booths.json) unique toll-booth nodes; failed tiles: ${failed}/${#boxes[@]}"
          jq -r '.elements[] | [.id,.lat,.lon,(.tags.name // ""),(.tags.ref // ""),(.tags.operator // ""),(.tags.highway // ""),(.tags.toll // "")] | @tsv' \
            inventory/m4-toll-booths.json | head -n 500 || true

          # Fail only after writing/uploading the combined partial inventory.
          if [ "$failed" -gt 0 ]; then
            exit 1
          fi

      - name: Upload inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osm-m4-toll-inventory
          path: |
            inventory/*.json
            inventory/parts/*.json
          retention-days: 7

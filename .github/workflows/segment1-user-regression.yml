name: Segment 1 user API regression

on:
  push:
    branches:
      - optimize-calculator-2
    paths:
      - "app/api/v2/calculate/**"
      - "lib/toll-engine/**"
      - "lib/tolls.ts"
      - "lib/toll-recovery.ts"
      - "lib/toll-validator.ts"
      - "scripts/segment1-user-regression.mjs"
      - "scripts/segment1-differential.mjs"
      - ".github/workflows/segment1-user-regression.yml"
  workflow_dispatch:

concurrency:
  group: segment1-user-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build branch
        run: pnpm build

      - name: Start local production server
        run: |
          PORT=3000 pnpm start > /tmp/mezhgorod-next.log 2>&1 &
          echo $! > /tmp/mezhgorod-next.pid
          for i in {1..45}; do
            if curl --fail --silent http://127.0.0.1:3000/api/version >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/mezhgorod-next.pid)" 2>/dev/null; then
              cat /tmp/mezhgorod-next.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/mezhgorod-next.log
          exit 1

      - name: Run user API regression
        env:
          CALCULATOR_URL: http://127.0.0.1:3000
        run: node scripts/segment1-user-regression.mjs

      - name: Compare protected routes with current production
        env:
          CALCULATOR_URL: http://127.0.0.1:3000
          BASELINE_URL: https://mezhgorod-calculator.vercel.app
        run: node scripts/segment1-differential.mjs

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/mezhgorod-next.log || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: segment1-regression
          path: |
            segment1-user-regression.json
            segment1-differential.json
          retention-days: 30
          if-no-files-found: warn

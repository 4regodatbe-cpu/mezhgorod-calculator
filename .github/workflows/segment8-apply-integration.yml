name: Segment 8 apply route integration
on:
  push:
    branches: [optimize-calculator-2]
    paths:
      - scripts/apply-segment8-route-integration.mjs
      - .github/workflows/segment8-apply-integration.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: optimize-calculator-2 }
      - name: Apply deterministic migration
        run: node scripts/apply-segment8-route-integration.mjs
      - name: Commit integration
        run: |
          if git diff --quiet -- app/api/v2/calculate/route.ts; then
            echo "No integration diff"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/v2/calculate/route.ts
          git commit -m "Integrate Segment 8 live route quality selection"
          git push origin HEAD:optimize-calculator-2

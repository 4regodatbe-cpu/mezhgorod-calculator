name: Segment 6A3B4 M11 boundary fixture gate

on:
  push:
    branches: [optimize-calculator-2]
    paths:
      - lib/toll-engine/m11-boundary-resolver.ts
      - scripts/segment6a3b4-m11-boundary-fixture-gate-test.ts
      - checkpoints/SEGMENT_6A3B4_M11_BOUNDARY_FIXTURE_GATE_PLAN.md
      - .github/workflows/segment6a3b4-m11-boundary-fixture-gate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.25.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22.13.0', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node --experimental-strip-types scripts/segment6a3b4-m11-boundary-fixture-gate-test.ts
      - name: Assert no production integration
        run: |
          if grep -q "m11-boundary-resolver" app/api/v2/calculate/route.ts; then exit 1; fi
      - run: pnpm build

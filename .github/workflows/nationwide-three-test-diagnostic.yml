name: Nationwide three-test diagnostic
on:
  push:
    branches: [fix/v3-missing-route-prices-2026-10-15]
    paths:
      - .github/workflows/nationwide-three-test-diagnostic.yml
permissions:
  contents: read
concurrency:
  group: nationwide-three-test-diagnostic-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Run only the three previously failing files and capture streams
        shell: bash
        run: |
          mkdir -p diagnostic-output
          set +e
          overall=0
          while IFS='|' read -r name test_file; do
            node --test "$test_file" >"diagnostic-output/$name.stdout.txt" 2>"diagnostic-output/$name.stderr.txt"
            code=$?
            printf '%s\n' "$code" >"diagnostic-output/$name.exit-code.txt"
            printf '%s: exit %s\n' "$name" "$code"
            cat "diagnostic-output/$name.stdout.txt"
            cat "diagnostic-output/$name.stderr.txt" >&2
            if [ "$code" -ne 0 ]; then overall=1; fi
          done <<'EOF'
          audit-child-process|experiments/nationwide-tolls/audit-child-process.test.mjs
          automatic-policy-replay-integration|experiments/nationwide-tolls/automatic-policy-replay-integration.test.mjs
          systemic-audit-report|experiments/nationwide-tolls/systemic-audit-report.test.mjs
          EOF
          exit "$overall"
      - name: Preserve exact diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nationwide-three-test-diagnostic-${{ github.run_id }}
          path: diagnostic-output/
          if-no-files-found: error
          retention-days: 30

name: Segment 6A3B3 M11 boundary resolver

on:
  push:
    branches: [optimize-calculator-2]
    paths:
      - lib/toll-engine/m11-boundary-resolver.ts
      - lib/toll-engine/m11-spatial-anchors.ts
      - scripts/segment6a3b3-m11-boundary-resolver-test.ts
      - data/tolls/m11/2026-10-01-58-679-spatial-anchors.json
      - checkpoints/SEGMENT_6A3B3_M11_BOUNDARY_RESOLVER_PLAN.md
      - .github/workflows/segment6a3b3-m11-boundary-resolver.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run deterministic resolver assertions
        run: node --experimental-strip-types scripts/segment6a3b3-m11-boundary-resolver-test.ts
      - name: Assert no production integration
        run: |
          if grep -q "m11-boundary-resolver" app/api/v2/calculate/route.ts; then
            echo "6A3B3 resolver must remain outside production API"
            exit 1
          fi
      - name: Production build
        run: pnpm build

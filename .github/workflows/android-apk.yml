name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon
      - name: Prepare APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk Mezhgorod-Calc.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Mezhgorod-Calc-APK
          path: Mezhgorod-Calc.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Межгород Calc — Android APK
          body: Установочный APK калькулятора межгородних поездок.
          files: Mezhgorod-Calc.apk
          make_latest: true

name: Segment 6A2B M11 OSRM step evidence probe

on:
  push:
    branches:
      - optimize-calculator-2
    paths:
      - scripts/segment6a2b-m11-osrm-steps-probe.mjs
      - .github/workflows/segment6a2b-m11-osrm-steps-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Probe existing OSRM route with steps=true
        run: node scripts/segment6a2b-m11-osrm-steps-probe.mjs

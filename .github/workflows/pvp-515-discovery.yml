name: PVP 515 node discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pvp-515-discovery.yml'

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Query targeted PVP window both directions
        shell: bash
        run: |
          set -euo pipefail
          url='https://mezhgorod-calculator.vercel.app/api/v2/debug-pvp-node'

          query() {
            local name="$1"
            local from="$2"
            local to="$3"
            echo "=== $name ==="
            curl --fail --retry 2 --retry-delay 4 --max-time 45 \
              --get "$url" \
              --data-urlencode "from=$from" \
              --data-urlencode "to=$to" \
              --data-urlencode 'lat=51.660641' \
              --data-urlencode 'lon=39.301775' \
              -o "$name.json"
            jq . "$name.json"
          }

          query northbound 'Краснодар' 'Москва'
          query southbound 'Москва' 'Краснодар'

      - name: Fetch exact OSM node coordinates
        shell: bash
        run: |
          set -euo pipefail
          for node in 3257030196 3200592308; do
            echo "=== OSM node $node ==="
            curl --fail --retry 2 --retry-delay 3 --max-time 20 \
              "https://api.openstreetmap.org/api/0.6/node/$node.json" \
              -o "node-$node.json"
            jq '.elements[0] | {id,lat,lon,tags}' "node-$node.json"
          done

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: pvp-515-discovery
          path: '*.json'
          retention-days: 2

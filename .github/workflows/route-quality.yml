name: Ежедневная проверка маршрутов

on:
  push:
    branches:
      - main
    paths:
      - "app/api/v2/**"
      - "app/api/version/**"
      - "lib/toll*.ts"
      - "lib/verified-routes.ts"
      - "data/verified-routes.json"
      - "scripts/route-monitor.mjs"
      - "scripts/m4-reverse-regression.mjs"
      - ".github/workflows/route-quality.yml"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: monitor
        continue-on-error: true
        env:
          CALCULATOR_URL: https://mezhgorod-calculator.vercel.app
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/route-monitor.mjs
      - id: m4_reverse
        continue-on-error: true
        env:
          CALCULATOR_URL: https://mezhgorod-calculator.vercel.app
        run: node scripts/m4-reverse-regression.mjs
      - name: Сохранить отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-quality-report
          path: |
            route-report.md
            route-report.json
          retention-days: 30
      - name: Сообщить об ошибках
        if: steps.monitor.outcome == 'failure' || steps.m4_reverse.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = 'Автопроверка обнаружила ошибку маршрута';
            const parts = [];
            if (fs.existsSync('route-report.md')) parts.push(fs.readFileSync('route-report.md', 'utf8'));
            parts.push(`M4 reverse regression: ${context.payload.workflow_run ? 'workflow' : 'push'}\nStatus: ${process.env.M4_STATUS || 'failed'}`);
            const body = parts.join('\n\n').slice(0, 60000);
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const issue = data.find(item => item.title === title);
            if (issue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
      - name: Завершить с ошибкой при отклонениях
        if: steps.monitor.outcome == 'failure' || steps.m4_reverse.outcome == 'failure'
        run: exit 1

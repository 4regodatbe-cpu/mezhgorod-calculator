name: Ежедневная проверка маршрутов

on:
  push:
    branches:
      - main
    paths:
      - "app/api/v2/**"
      - "app/api/version/**"
      - "lib/**"
      - "data/**"
      - "scripts/route-monitor.mjs"
      - ".github/workflows/route-quality.yml"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose the route monitor or an isolated production build"
        required: true
        type: choice
        options:
          - route-monitor
          - build-only
        default: route-monitor

permissions:
  contents: read
  issues: write

jobs:
  check-routes:
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'build-only'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Запустить локальную production-сборку
        run: |
          pnpm start > /tmp/route-monitor-next.log 2>&1 &
          echo $! > /tmp/route-monitor-next.pid
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:3000/v2 >/dev/null && exit 0; sleep 1; done
          cat /tmp/route-monitor-next.log
          exit 1
      - id: monitor
        continue-on-error: true
        env:
          CALCULATOR_URL: http://127.0.0.1:3000
        run: node scripts/route-monitor.mjs
      - name: Сохранить отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-quality-report
          path: |
            route-report.md
            route-report.json
          retention-days: 30
      - name: Сообщить об ошибках
        if: steps.monitor.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = 'Автопроверка обнаружила ошибку маршрута';
            const body = fs.readFileSync('route-report.md', 'utf8').slice(0, 60000);
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const issue = data.find(item => item.title === title);
            if (issue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
      - name: Остановить локальный сервер
        if: always()
        run: test ! -f /tmp/route-monitor-next.pid || kill $(cat /tmp/route-monitor-next.pid) || true
      - name: Завершить с ошибкой при отклонениях
        if: steps.monitor.outcome == 'failure'
        run: exit 1

  build-only:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'build-only'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Record source and runtime identity
        run: |
          mkdir -p build-only-evidence
          {
            printf 'source_sha='
            git rev-parse HEAD
            printf 'source_tree='
            git rev-parse 'HEAD^{tree}'
            printf 'node='
            node --version
            printf 'pnpm='
            pnpm --version
            printf 'next_declared='
            node -p "require('./package.json').dependencies.next"
            sha256sum package.json pnpm-lock.yaml
          } | tee build-only-evidence/environment.txt
      - name: Install frozen dependencies
        run: |
          set +e
          pnpm install --frozen-lockfile > build-only-evidence/install.stdout.log 2> build-only-evidence/install.stderr.log
          status=$?
          printf '%s\n' "$status" > build-only-evidence/install.exit-code
          cat build-only-evidence/install.stdout.log
          cat build-only-evidence/install.stderr.log >&2
          exit "$status"
      - name: TypeScript typecheck
        run: |
          set +e
          node node_modules/typescript/bin/tsc --noEmit > build-only-evidence/typecheck.stdout.log 2> build-only-evidence/typecheck.stderr.log
          status=$?
          printf '%s\n' "$status" > build-only-evidence/typecheck.exit-code
          cat build-only-evidence/typecheck.stdout.log
          cat build-only-evidence/typecheck.stderr.log >&2
          exit "$status"
      - name: Next.js production build without test:audit
        run: |
          set +e
          node node_modules/next/dist/bin/next build > build-only-evidence/next-build.stdout.log 2> build-only-evidence/next-build.stderr.log
          status=$?
          printf '%s\n' "$status" > build-only-evidence/next-build.exit-code
          cat build-only-evidence/next-build.stdout.log
          cat build-only-evidence/next-build.stderr.log >&2
          exit "$status"
      - name: Hash captured evidence
        if: always()
        run: |
          find build-only-evidence -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > build-only-evidence/SHA256SUMS
          cat build-only-evidence/SHA256SUMS
      - name: Upload build-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-quality-build-only-${{ github.sha }}
          path: build-only-evidence/
          if-no-files-found: warn
          retention-days: 30

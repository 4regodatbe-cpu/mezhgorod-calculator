name: Ежедневная проверка маршрутов

on:
  push:
    branches:
      - main
    paths:
      - "app/api/v2/**"
      - "app/api/version/**"
      - "lib/toll*.ts"
      - "lib/verified-routes.ts"
      - "data/verified-routes.json"
      - "scripts/route-monitor.mjs"
      - "scripts/m4-reverse-regression.mjs"
      - "scripts/m4-evidence-regression.mjs"
      - ".github/workflows/route-quality.yml"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: monitor
        continue-on-error: true
        env:
          CALCULATOR_URL: https://mezhgorod-calculator.vercel.app
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/route-monitor.mjs
      - id: m4_reverse
        continue-on-error: true
        env:
          CALCULATOR_URL: https://mezhgorod-calculator.vercel.app
        run: node scripts/m4-reverse-regression.mjs
      - id: m4_evidence
        continue-on-error: true
        env:
          CALCULATOR_URL: https://mezhgorod-calculator.vercel.app
        run: node scripts/m4-evidence-regression.mjs
      - name: Завершить с ошибкой при отклонениях
        if: steps.monitor.outcome == 'failure' || steps.m4_reverse.outcome == 'failure' || steps.m4_evidence.outcome == 'failure'
        run: exit 1

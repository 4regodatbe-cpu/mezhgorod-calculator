name: Ежедневная проверка маршрутов

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: monitor
        continue-on-error: true
        env:
          CALCULATOR_URL: https://mezhgorod-calculator.vercel.app
        run: node scripts/route-monitor.mjs
      - name: Сохранить отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-quality-report
          path: |
            route-report.md
            route-report.json
          retention-days: 30
      - name: Сообщить об ошибках
        if: steps.monitor.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = 'Автопроверка обнаружила ошибку маршрута';
            const body = fs.readFileSync('route-report.md', 'utf8').slice(0, 60000);
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const issue = data.find(item => item.title === title);
            if (issue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
      - name: Завершить с ошибкой при отклонениях
        if: steps.monitor.outcome == 'failure'
        run: exit 1

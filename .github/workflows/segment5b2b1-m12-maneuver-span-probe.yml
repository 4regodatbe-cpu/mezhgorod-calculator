name: Segment 5B2B-1 M12 maneuver span probe

on:
  push:
    branches:
      - optimize-calculator-2
    paths:
      - scripts/segment5b2b1-m12-maneuver-span-probe.mjs
      - .github/workflows/segment5b2b1-m12-maneuver-span-probe.yml
      - checkpoints/M12_SEGMENT_5B2B1_PLAN.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Probe normal route maneuver span evidence
        run: node scripts/segment5b2b1-m12-maneuver-span-probe.mjs

      - name: Upload maneuver probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: segment5b2b1-m12-maneuver-span-probe
          path: segment5b2b1-m12-maneuver-span-probe.json
          if-no-files-found: warn
          retention-days: 7

name: Segment 6A3B2E M11 multi-anchor spatial model

on:
  push:
    branches:
      - optimize-calculator-2
    paths:
      - lib/toll-engine/m11-spatial-anchors.ts
      - scripts/segment6a3b2e-m11-spatial-anchor-model-test.ts
      - data/tolls/m11/2026-10-01-58-679-spatial-anchors.json
      - data/tolls/m11/2026-10-01-58-679-category1-a1-current.json
      - checkpoints/SEGMENT_6A3B2E_M11_MULTI_ANCHOR_MODEL_PLAN.md
      - .github/workflows/segment6a3b2e-m11-spatial-anchor-model.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run deterministic M11 multi-anchor spatial assertions
        run: node --experimental-strip-types scripts/segment6a3b2e-m11-spatial-anchor-model-test.ts

      - name: Assert no production API integration
        run: |
          if grep -q "m11-spatial-anchors" app/api/v2/calculate/route.ts; then
            echo "Segment 6A3B2E must not integrate M11 spatial evidence into production API"
            exit 1
          fi

      - name: Production build
        run: pnpm build

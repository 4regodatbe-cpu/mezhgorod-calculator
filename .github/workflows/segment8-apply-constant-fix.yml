name: Segment 8 apply spread constant fix
on:
  push:
    branches: [optimize-calculator-2]
    paths:
      - scripts/apply-segment8-constant-fix.mjs
      - .github/workflows/segment8-apply-constant-fix.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: optimize-calculator-2 }
      - run: node scripts/apply-segment8-constant-fix.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/v2/calculate/route.ts
          git commit -m "Fix Segment 8 provider spread constant"
          git push origin HEAD:optimize-calculator-2

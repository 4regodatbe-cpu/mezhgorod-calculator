name: Route quality and offline benchmark integrity

on:
  push:
    branches: ["**"]
    paths:
      - "app/api/v2/calculate/route.ts"
      - "lib/v2-calculation/**"
      - "lib/tolls.ts"
      - "lib/toll-recovery.ts"
      - "lib/toll-recovery-data.ts"
      - "lib/toll-data/**"
      - "lib/toll-engine/m4-*.ts"
      - "lib/toll-engine/m11-*.ts"
      - "lib/toll-engine/m12-route-*.ts"
      - "app/v2/**"
      - "lib/route-quality.ts"
      - "lib/route-providers.ts"
      - "lib/safe-route.ts"
      - "lib/route-corridors.ts"
      - "lib/route-pricing-segments.ts"
      - "lib/route-pricing-integration.ts"
      - "scripts/route-corridor-policy-test.ts"
      - "scripts/route-pricing-integration-test.ts"
      - "scripts/api-contract-smoke.mjs"
      - "scripts/safe-route-position-test.ts"
      - "scripts/segment5b2c2-m12-core-assertions.mjs"
      - "data/fixtures/m12-route-projections-2026-09-30.json"
      - "data/tolls/m12-2026-03-02-category1.json"
      - "data/tolls/m12-rvp-evidence-2026-09-30.json"
      - "benchmarks/routes/yandex-2026-10-02/**"
      - "scripts/segment8-route-quality-test.ts"
      - "scripts/route-quality-majority-test.ts"
      - "scripts/yandex-route-benchmark-integrity.mjs"
      - ".github/workflows/segment8-route-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.25.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22.13.0' }
      - run: pnpm install --frozen-lockfile
      - name: Pure live-provider selection tests
        run: |
          node --experimental-strip-types scripts/segment8-route-quality-test.ts
          node --experimental-strip-types scripts/route-quality-majority-test.ts
          node --experimental-strip-types scripts/safe-route-position-test.ts
          node --experimental-strip-types scripts/segment5b2c2-m12-core-assertions.mjs
      - name: Corridor and segment tariff regressions
        run: |
          node --experimental-strip-types scripts/route-corridor-policy-test.ts
          node --experimental-strip-types scripts/route-pricing-integration-test.ts
      - name: Offline route benchmark integrity
        run: pnpm test:route-benchmark
      - name: Keep benchmark data out of runtime routing
        run: |
          ! grep -REq 'findVerifiedRoute|goldenRouteReference|tollPeriodsForRoute|verifiedTollControl' app/api/v2/calculate/route.ts lib/v2-calculation
          grep -q 'selectLiveRouteCandidates' lib/v2-calculation/route-leg.ts
          ! grep -R -E 'data/verified-routes.json|lib/verified-routes' app/api/v2 app/v2 lib/v2-calculation
      - name: Production build
        run: pnpm build
      - name: V2 API request validation smoke
        run: |
          pnpm start > /tmp/mezhgorod-v2-smoke.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/v2 >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/v2 >/dev/null
          CALCULATOR_URL=http://127.0.0.1:3000 node scripts/api-contract-smoke.mjs

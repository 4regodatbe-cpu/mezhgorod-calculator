name: Segment 8 route distance quality
on:
  push:
    branches: [optimize-calculator-2]
    paths:
      - app/api/v2/calculate/route.ts
      - lib/route-quality.ts
      - lib/verified-routes.ts
      - data/verified-routes.json
      - scripts/segment8-route-quality-test.ts
      - scripts/segment8-golden-corpus-test.ts
      - .github/workflows/segment8-route-quality.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  route-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.25.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22.13.0' }
      - run: pnpm install --frozen-lockfile
      - name: Pure route-quality corpus
        run: node --experimental-strip-types scripts/segment8-route-quality-test.ts
      - name: Golden route corpus integrity
        run: node --experimental-strip-types scripts/segment8-golden-corpus-test.ts
      - name: No hidden stored-route substitution
        run: |
          ! grep -q 'KNOWN_FAST_ROUTES\|KNOWN_FREE_ROUTES\|return.*route: known' app/api/v2/calculate/route.ts
          grep -q 'selectLiveRoute' app/api/v2/calculate/route.ts
          grep -q 'goldenRouteReference' app/api/v2/calculate/route.ts
      - name: Production build
        shell: bash
        run: |
          set +e
          pnpm build > segment8-build.log 2>&1
          code=$?
          cat segment8-build.log
          exit $code
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: segment8-build-log
          path: segment8-build.log
          if-no-files-found: ignore

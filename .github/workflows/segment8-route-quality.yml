name: Route quality and offline benchmark integrity

on:
  push:
    branches: ["**"]
    paths:
      - "app/api/v2/calculate/route.ts"
      - "lib/route-quality.ts"
      - "lib/route-providers.ts"\n      - "lib/safe-route.ts"\n      - "lib/route-corridors.ts"\n      - "scripts/safe-route-position-test.ts"
      - "benchmarks/routes/yandex-2026-10-02/**"
      - "scripts/segment8-route-quality-test.ts"
      - "scripts/route-quality-majority-test.ts"
      - "scripts/yandex-route-benchmark-integrity.mjs"
      - ".github/workflows/segment8-route-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.25.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22.13.0' }
      - run: pnpm install --frozen-lockfile
      - name: Pure live-provider selection tests
        run: |
          node --experimental-strip-types scripts/segment8-route-quality-test.ts
          node --experimental-strip-types scripts/route-quality-majority-test.ts\n          node --experimental-strip-types scripts/safe-route-position-test.ts
      - name: Offline route benchmark integrity
        run: pnpm test:route-benchmark
      - name: Keep benchmark data out of runtime routing
        run: |
          ! grep -Eq 'findVerifiedRoute|goldenRouteReference|tollPeriodsForRoute|verifiedTollControl' app/api/v2/calculate/route.ts
          grep -q 'selectLiveRouteCandidates' app/api/v2/calculate/route.ts
          ! grep -R -E 'data/verified-routes.json|lib/verified-routes' app/api/v2 app/v2
      - name: Production build
        run: pnpm build

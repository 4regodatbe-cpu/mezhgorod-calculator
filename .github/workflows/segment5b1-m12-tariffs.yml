name: Segment 5B1 M12 official tariffs

on:
  push:
    branches:
      - optimize-calculator-2
    paths:
      - data/tolls/m12-2026-03-02-category1.json
      - lib/toll-engine/m12-tariffs.ts
      - scripts/segment5b1-m12-tariff-assertions.mjs
      - .github/workflows/segment5b1-m12-tariffs.yml
      - checkpoints/M12_SEGMENT_5B1_PLAN.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert official M12 tariff matrix
        run: node --experimental-strip-types scripts/segment5b1-m12-tariff-assertions.mjs

      - name: Build application
        run: pnpm build

      - name: Upload tariff assertion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: segment5b1-m12-tariff-assertions
          path: segment5b1-m12-tariff-assertions.json
          if-no-files-found: warn
          retention-days: 7

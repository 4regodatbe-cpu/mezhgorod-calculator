name: Calculator final gate
on:
  pull_request:
    branches: [main, audit/v3-matrix-provenance-2026-10-14]
    paths:
      - .env.example
      - app/page.tsx
      - app/api/v2/**
      - app/api/v3/**
      - app/api/collect/**
      - app/api/suggest/**
      - app/v2/**
      - app/v3/**
      - android-app-v2/**
      - google-apps-script/**
      - lib/**
      - data/**
      - scripts/**
      - vercel.json
      - .github/workflows/android-apk.yml
      - .github/workflows/calculator-final-gate.yml
  push:
    branches: [fix/v3-missing-route-prices-2026-10-15]
    paths:
      - .env.example
      - app/page.tsx
      - app/api/v2/**
      - app/api/v3/**
      - app/api/collect/**
      - app/api/suggest/**
      - app/v2/**
      - app/v3/**
      - lib/**
      - data/**
      - scripts/**
      - vercel.json
      - .github/workflows/calculator-final-gate.yml
permissions:
  contents: read
concurrency:
  group: calculator-final-gate-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true
jobs:
  final-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.25.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24.x', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Legacy V2 safety and shared tariff truth gates
        run: node scripts/segment10-production-readiness.mjs
      - name: Current V3 production-readiness truth gates
        run: node scripts/v3-production-readiness.mjs
      - name: Static civilian corridor policy
        run: node --experimental-strip-types scripts/route-corridor-policy-test.ts
      - name: Route pricing integration regressions
        run: node --experimental-strip-types scripts/route-pricing-integration-test.ts
      - name: External toll benchmark corpus
        run: node scripts/segment9-regression.mjs
      - name: Route-quality corpus
        run: node --experimental-strip-types scripts/segment8-route-quality-test.ts
      - name: Offline Yandex benchmark corpus integrity
        run: pnpm test:route-benchmark
      - name: V3 API, toll composition, and unknown-price integrity suites
        run: node --import ./scripts/register-ts-paths.mjs --test scripts/v3-pipeline-integrity.test.ts scripts/v3-final-price-integrity.test.ts scripts/v3-unpriced-coverage-audit.test.ts scripts/v3-all-routing-providers-unavailable.test.ts
      - name: M12 recovery replay
        run: node scripts/segment5a1-m12-recovery-replay.mjs
      - name: Systemic composition regression
        run: node --experimental-strip-types scripts/systemic-toll-composition-test.ts
      - name: CKAD production regression
        run: node --experimental-strip-types scripts/ckad-production-test.ts
      - name: M4 strict traversal regression
        run: node --experimental-strip-types scripts/m4-route-traversal-test.ts
      - name: M11 Moscow regression
        run: node --experimental-strip-types scripts/m11-moscow-production-test.ts
      - name: Majority route selection regression
        run: node --experimental-strip-types scripts/route-quality-majority-test.ts
      - run: pnpm lint
      - run: pnpm build
      - name: Start production server
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          pnpm start > /tmp/mezhgorod-next.log 2>&1 &
          echo $! > /tmp/mezhgorod-next.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/v3 >/dev/null && exit 0; sleep 1; done
          cat /tmp/mezhgorod-next.log
          exit 1
      - name: Canonical root redirects to V3; legacy V2 remains available
        run: |
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" = "307"
          curl -sSI http://127.0.0.1:3000/ | grep -qi '^location: /v3'
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/v2)" = "200"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/version)" = "200"
      - name: API contract smoke
        env:
          CALCULATOR_URL: http://127.0.0.1:3000
        run: node scripts/api-contract-smoke.mjs
      - name: Current V3 live route audit
        id: v3_live
        continue-on-error: true
        env:
          CALCULATOR_URL: http://127.0.0.1:3000
          EXPECTED_COMMIT: ${{ github.sha }}
          V3_LIVE_ROUTE_REPORT: /tmp/v3-live-route-results.json
        run: node scripts/v3-live-route-audit.mjs
      - name: Upload sanitized V3 route diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-live-route-diagnostics-${{ github.sha }}
          path: /tmp/v3-live-route-results.json
          if-no-files-found: ignore
      - name: Tariff freshness
        id: tariff_freshness
        continue-on-error: true
        env:
          TARIFF_STALE_STRICT: '1'
          TARIFF_PRODUCT_EVIDENCE: experiments/tariff-gate-proposal/stage-ah-product-evidence-2026-11-07.json
        run: node scripts/check-tariff-freshness.mjs
      - name: Final aggregate gate
        if: always()
        env:
          LIVE_OUTCOME: ${{ steps.v3_live.outcome }}
          FRESHNESS_OUTCOME: ${{ steps.tariff_freshness.outcome }}
          PREVIOUS_JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$LIVE_OUTCOME" = "failure" ] || [ "$FRESHNESS_OUTCOME" = "failure" ] || [ "$PREVIOUS_JOB_STATUS" = "failure" ]; then
            echo "Final gate failed: inspect the live V3 route report, tariff freshness, and failed steps above."
            exit 1
          fi
          if [ "$LIVE_OUTCOME" != "success" ] || [ "$FRESHNESS_OUTCOME" != "success" ]; then
            echo "Final gate incomplete: live V3 or strict tariff freshness was skipped."
            exit 1
          fi
          echo "Final gate passed: offline, build, V3 smoke, live route audit, and strict freshness all succeeded."
      - name: Stop server
        if: always()
        run: test ! -f /tmp/mezhgorod-next.pid || kill $(cat /tmp/mezhgorod-next.pid) || true

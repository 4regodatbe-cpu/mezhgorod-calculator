name: M12 OSM toll inventory

on:
  push:
    branches:
      - optimize-calculator-2
    paths:
      - ".github/workflows/m12-osm-inventory.yml"
  workflow_dispatch:

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Query M12 toll gantries by corridor boxes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inventory

          # Split the Moscow→Kazan corridor so public Overpass instances do not
          # receive one huge query. Boxes deliberately overlap at their edges.
          boxes=(
            '55.45,37.55,56.35,40.80'
            '54.90,40.60,56.25,43.90'
            '54.75,43.70,56.25,46.80'
            '54.70,46.60,56.35,49.95'
          )
          endpoints=(
            'https://maps.mail.ru/osm/tools/overpass/api/interpreter'
            'https://overpass.private.coffee/api/interpreter'
            'https://overpass-api.de/api/interpreter'
          )

          echo '[]' > inventory/all.json
          index=0
          for bbox in "${boxes[@]}"; do
            index=$((index + 1))
            query="[out:json][timeout:35];(node[\"highway\"=\"toll_gantry\"](${bbox});node[\"barrier\"=\"toll_booth\"](${bbox}););out body;"
            ok=0
            for endpoint in "${endpoints[@]}"; do
              echo "box=${index} endpoint=${endpoint}"
              if curl --fail --show-error --silent --max-time 50 \
                -A 'MezhgorodM12Audit/1.0 (GitHub Actions)' \
                -H 'Content-Type: application/x-www-form-urlencoded' \
                --data-urlencode "data=${query}" \
                "$endpoint" -o "inventory/box-${index}.json"; then
                if jq -e '.elements | type == "array"' "inventory/box-${index}.json" >/dev/null; then
                  ok=1
                  break
                fi
              fi
            done
            if [ "$ok" -ne 1 ]; then
              echo "All Overpass endpoints failed for box ${index}" >&2
              exit 1
            fi
            jq '.elements' "inventory/box-${index}.json" > "inventory/box-${index}-elements.json"
            jq -s 'add | unique_by(.id)' inventory/all.json "inventory/box-${index}-elements.json" > inventory/merged.json
            mv inventory/merged.json inventory/all.json
            sleep 2
          done

          jq '[.[] | {id,type,lat,lon,tags}]' inventory/all.json > inventory/m12-toll-nodes.json
          echo "nodes=$(jq length inventory/m12-toll-nodes.json)"
          jq -r '.[] | [.id,.lat,.lon,(.tags.highway // ""),(.tags.barrier // ""),(.tags.name // ""),(.tags.ref // ""),(.tags.operator // ""),(.tags.direction // ""),(.tags.description // "")] | @tsv' inventory/m12-toll-nodes.json

      - name: Upload inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m12-osm-toll-inventory
          path: inventory/*.json
          retention-days: 30
          if-no-files-found: warn

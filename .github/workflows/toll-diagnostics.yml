name: M4 local toll diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/toll-diagnostics.yml'
      - 'lib/toll-engine/**'
      - 'app/api/v2/debug-m4/**'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Wait for production deployment
        run: sleep 75

      - name: Query problem routes
        shell: bash
        run: |
          set -euo pipefail
          base='https://mezhgorod-calculator.vercel.app/api/v2/debug-m4'
          mkdir -p diagnostics

          query() {
            local name="$1"
            local from="$2"
            local to="$3"
            echo "=== $name ==="
            curl --fail --retry 1 --retry-delay 5 --max-time 50 \
              --get "$base" \
              --data-urlencode "from=$from" \
              --data-urlencode "to=$to" \
              -o "diagnostics/$name.json"
            jq '{
              from,
              to,
              fastKm,
              fastMinutes,
              geometryPoints,
              totalElapsedMs,
              validation: {
                candidateRadiusKm: .validation.candidateRadiusKm,
                candidateCount: .validation.candidateCount,
                checkedCandidateCount: .validation.checkedCandidateCount,
                confirmedCount: .validation.confirmedCount,
                rejectedCount: .validation.rejectedCount,
                unknownCount: .validation.unknownCount,
                complete: .validation.complete,
                message: .validation.message,
                checks: [.validation.checks[] | {km,status,nearestDistanceKm,matchedNodeIds,message}]
              },
              pricing: {
                status: .pricing.status,
                confidence: .pricing.confidence,
                amount: .pricing.amount,
                weekdayAmount: .pricing.weekdayAmount,
                weekendAmount: .pricing.weekendAmount,
                pricedPlazas: .pricing.pricedPlazas,
                unresolved: .pricing.unresolved,
                message: .pricing.message
              }
            }' "diagnostics/$name.json"
          }

          # South -> Moscow control set.
          query yeisk-moscow 'Ейск' 'Москва'
          query maykop-moscow 'Майкоп' 'Москва'
          query yalta-moscow 'Ялта' 'Москва'
          query krasnodar-moscow 'Краснодар' 'Москва'
          query sochi-moscow 'Сочи' 'Москва'

          # Exact reverse directions: validates opposite-direction OSM nodes and
          # reverse route-order branches of the mixed-zone pricing logic.
          query moscow-yeisk 'Москва' 'Ейск'
          query moscow-maykop 'Москва' 'Майкоп'
          query moscow-yalta 'Москва' 'Ялта'
          query moscow-krasnodar 'Москва' 'Краснодар'
          query moscow-sochi 'Москва' 'Сочи'

      - name: Assert M4 regression invariants
        shell: bash
        run: |
          set -euo pipefail

          assert_route() {
            local name="$1"
            local weekday="$2"
            local weekend="$3"
            local file="diagnostics/$name.json"

            echo "=== assert $name ==="
            jq -e \
              --argjson weekday "$weekday" \
              --argjson weekend "$weekend" '
                (.validation.complete == true) and
                (.validation.checkedCandidateCount == .validation.candidateCount) and
                (.validation.unknownCount == 0) and
                (.pricing.status == "priced") and
                ((.pricing.unresolved | length) == 0) and
                (.pricing.weekdayAmount == $weekday) and
                (.pricing.weekendAmount == $weekend) and
                ((.pricing.amount == $weekday) or (.pricing.amount == $weekend)) and
                ((.pricing.confidence == "medium") or (.pricing.confidence == "high"))
              ' "$file" >/dev/null

            echo "PASS $name: weekday=${weekday}, weekend=${weekend}, confidence=$(jq -r '.pricing.confidence' "$file")"
          }

          # Exact tariff expectations from the verified 2026-09-29 M-4 snapshot.
          assert_route yeisk-moscow 5240 7240
          assert_route maykop-moscow 6090 8400
          assert_route yalta-moscow 5240 7240
          assert_route krasnodar-moscow 6090 8400
          assert_route sochi-moscow 6090 8400

          # Reverse directions must remain tariff-symmetric for the same corridor.
          assert_route moscow-yeisk 5240 7240
          assert_route moscow-maykop 6090 8400
          assert_route moscow-yalta 5240 7240
          assert_route moscow-krasnodar 6090 8400
          assert_route moscow-sochi 6090 8400

      - name: Upload diagnostic JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-local-diagnostics
          path: diagnostics/*.json
          retention-days: 4
          if-no-files-found: warn

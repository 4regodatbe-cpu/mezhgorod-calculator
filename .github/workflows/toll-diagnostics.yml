name: M4 local toll diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/toll-diagnostics.yml'
      - 'lib/toll-engine/**'
      - 'app/api/v2/debug-m4/**'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for production deployment
        run: sleep 75

      - name: Query problem routes
        shell: bash
        run: |
          set -euo pipefail
          base='https://mezhgorod-calculator.vercel.app/api/v2/debug-m4'
          mkdir -p diagnostics

          query() {
            local name="$1"
            local from="$2"
            local to="$3"
            echo "=== $name ==="
            curl --fail --retry 1 --retry-delay 5 --max-time 50 \
              --get "$base" \
              --data-urlencode "from=$from" \
              --data-urlencode "to=$to" \
              -o "diagnostics/$name.json"
            jq '{
              from,
              to,
              fastKm,
              fastMinutes,
              geometryPoints,
              totalElapsedMs,
              validation: {
                candidateRadiusKm: .validation.candidateRadiusKm,
                candidateCount: .validation.candidateCount,
                checkedCandidateCount: .validation.checkedCandidateCount,
                confirmedCount: .validation.confirmedCount,
                rejectedCount: .validation.rejectedCount,
                unknownCount: .validation.unknownCount,
                complete: .validation.complete,
                message: .validation.message,
                checks: [.validation.checks[] | {km,status,nearestDistanceKm,matchedNodeIds,message}]
              },
              pricing: {
                status: .pricing.status,
                confidence: .pricing.confidence,
                amount: .pricing.amount,
                weekdayAmount: .pricing.weekdayAmount,
                weekendAmount: .pricing.weekendAmount,
                pricedPlazas: .pricing.pricedPlazas,
                unresolved: .pricing.unresolved,
                message: .pricing.message
              }
            }' "diagnostics/$name.json"
          }

          query yeisk-moscow 'Ейск' 'Москва'
          query maykop-moscow 'Майкоп' 'Москва'
          query yalta-moscow 'Ялта' 'Москва'
          query krasnodar-moscow 'Краснодар' 'Москва'
          query sochi-moscow 'Сочи' 'Москва'

      - name: Upload diagnostic JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-local-diagnostics
          path: diagnostics/*.json
          retention-days: 4
          if-no-files-found: warn

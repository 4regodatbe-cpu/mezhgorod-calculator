name: Live user-route toll audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.25.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Start local production server
        run: |
          pnpm start > /tmp/calculator.log 2>&1 &
          echo $! > /tmp/calculator.pid
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:3000/v2 >/dev/null && exit 0; sleep 1; done
          cat /tmp/calculator.log
          exit 1
      - name: Audit reported real routes
        run: node scripts/live-user-route-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-user-route-audit
          path: artifacts/live-user-route-audit.json
          if-no-files-found: ignore
      - name: Stop server
        if: always()
        run: test ! -f /tmp/calculator.pid || kill $(cat /tmp/calculator.pid) || true
